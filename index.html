<script>

class Piece {
  label;
  constructor(x, y, color, hasMoved) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.hasMoved = hasMoved;
  } 

  copy(x, y){
    return new this.constructor(x, y, this.getColor())
  }

  render(){
    const name = this.getColor()+"-"+(this.getLabel().toLowerCase())
    const buffer = pieceBuffers.get(name)
    const actualTile = game.boardOrientation === 1 ? {x: this.x, y: this.y} : {x: 7-this.x, y: 7-this.y}
    if(!buffer)return;
    for (let y = 0; y < buffer.length; y++) {
      for (let x = 0; x < buffer[y].length; x++) {
        const fill = {r: buffer[y][x][0], g: buffer[y][x][1], b: buffer[y][x][2], a: buffer[y][x][3]}        
        //hover makes outline grey
        if (game.hovered && game.hovered.x === this.x && game.hovered.y === this.y && fill.r + fill.g + fill.b === 0){
          fill.r = 127; fill.g = 127; fill.b = 127;
        }
        //selected makes outline white
        if (game.selected && game.selected.x === this.x && game.selected.y === this.y && buffer[y][x][0] + buffer[y][x][1] + buffer[y][x][2] === 0){
          fill.r = 255; fill.g = 255; fill.b = 255;
        }
        ctx.fillStyle = `rgba(${fill.r},${fill.g},${fill.b},${fill.a})`;
        ctx.fillRect(boardOffset.x + actualTile.x * TILE + x, boardOffset.y + actualTile.y * TILE + y, 1, 1);
      }
    } 
  }

  move(pos){
    game.board[this.y][this.x] = null;
    this.x = pos.x; this.y = pos.y;
    game.board[this.y][this.x] = this;
  }

  setLabel(l){ this.label = this.color === "black" ? l : l.toUpperCase();}

  getLabel(){ return this.label;}

  getColor(){
    return this.color;
  }

  getPieces(){
    return this;
  }

  static isFriendly(p1, p2){
    return p1.getColor() === p2.getColor();
  }

  isFriendlyKing(k){
    return (k instanceof King && this.getColor() === k.getColor())
  }

  getValidMoves(theBoard) {
    const moves = [];

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (this.isMoveLegal(theBoard, { x, y })) {
          moves.push({ x, y });
        }
      }
    }
    return moves;
  }

  isMoveLegal(board, to){
    if (!this.sees(board, to)) return false;
    if (game.resultsInEnemyCheck(board, this, to)) return false;    
    return true;
  }

}

class Pawn extends Piece{

  constructor(x, y, color, hasMoved, isPassing){
    super(x, y, color)
    this.setLabel("p")
    this.dir = this.color === "white" ? -1 : 1
    this.hasMoved = hasMoved
    this.isPassing = isPassing;
  }

  sees(board, square){
    const dx = square.x - this.x
    const dy = square.y - this.y
    if (Math.abs(dx) > 1 || Math.abs(dy) > 2)return false;
    if (Math.sign(dy) !== Math.sign(this.dir)) return false;
    if (Math.abs(dx) === 1 && Math.abs(dy) === 2)return false;

    const target = board[square.y][square.x];
    if (this.isFriendlyKing(target))return false;
    if (target && dx === 0) return false;
    if ((this.hasMoved === true) && Math.abs(dy) === 2) return false;
    if ( Math.abs(dy) === 2 && !game.clearPath(board, {x: this.x, y: this.y}, square))return false;

    //capturing/eating
    if (Math.abs(dx) === 1 && dy === this.dir){
      if(!target){
        if (!this.canEnPassant(board, square)) return false;
      } 
    }

    return true;
  }

  canEnPassant(board, to){
    const neighbor = board[this.y][to.x]
    if (neighbor && neighbor.isPassing){
      return true;
    }
  }
}

class Knight extends Piece{
  constructor(x, y, color){
    super(x, y, color)
    this.setLabel("n")
  }

  sees(board, square){
    const target = board[square.y][square.x];
    if (this.isFriendlyKing(target))return false;

    const absX = Math.abs(square.x-this.x);
    const absY = Math.abs(square.y-this.y);
    if (!((absX === 1 && absY === 2) || (absX === 2 && absY === 1))) return false;
    return true;
  }
}

class Bishop extends Piece{
  constructor(x, y, color){
    super(x, y, color)
    this.setLabel("b")
  }

  sees(board, square){
    const target = board[square.y][square.x];    
    if (this.isFriendlyKing(target))return false;
    const absX = Math.abs(square.x-this.x);
    const absY = Math.abs(square.y-this.y);
    if (absX !== absY) return false;
    if (!game.clearPath(board, {x: this.x, y: this.y}, square)) return false;
    return true; 
  }

}

class Rook extends Piece{
  constructor(x, y, color, hasMoved){
    super(x, y, color)
    this.setLabel("r")
  }

  sees(board, square){
    const target = board[square.y][square.x];    
    if (this.isFriendlyKing(target))return false;
    const dx = square.x-this.x;
    const dy = square.y-this.y;
    if (dx !== 0 && dy !== 0) return false;
    if (!game.clearPath(board, {x: this.x, y: this.y}, square)) return false;
    return true;
  }
}

class Queen extends Piece{
  constructor(x, y, color){
    super(x, y, color)
    this.setLabel("q")
  }

  sees(board, square){
    const target = board[square.y][square.x];    
    if (this.isFriendlyKing(target))return false;

    const absX = Math.abs(square.x-this.x);
    const absY = Math.abs(square.y-this.y);
    const dx = square.x-this.x;
    const dy = square.y-this.y;

    if ((absX !== absY) && (dx !== 0 && dy !== 0)) return false;
    if (!game.clearPath(board, {x: this.x, y: this.y}, square)) return false;
    return true; 
  }
}

class King extends Piece{
  constructor(x, y, color, hasMoved){
    super(x, y, color)
    this.setLabel("k")
  }

  sees(board, square){
    const toPiece = board[square.y][square.x];

    if (toPiece && Piece.isFriendly(this, toPiece)) return false;
    const dx = Math.abs(square.x-this.x);
    const dy = Math.abs(square.y-this.y);

    if (dy > 1) return false;
    if (dx > 1){
      if (!this.canCastle(board, square)) return false;
    }
    return true; 
  }

  canCastle(board, to){
    const dx = to.x-this.x;
    const dy = to.y-this.y; 
    if (Math.abs(dx) !== 2 || dy !== 0) return false;
    if (this.hasMoved) return false;
    const potentialCastler = dx > 0 ? board[this.y][7] : board[this.y][0]
    if (!potentialCastler) return false;
    if (!(potentialCastler instanceof Rook)) return false;
    if (potentialCastler.hasMoved) return false;
    if (!game.clearPath(board, {x: this.x, y: this.y}, {x: potentialCastler.x, y: potentialCastler.y})) return false;
    const oppColor = this.getColor() === "white" ? "black" : "white";
    const castleDir = Math.sign(dx);

    if (game.playerSees(oppColor, board, {x: this.x, y: this.y})) return false;
    if (game.playerSees(oppColor, board, {x: this.x+castleDir, y: this.y})) return false;
    if (game.playerSees(oppColor, board, {x: this.x+(2*castleDir), y: this.y})) return false;
    return true;
  }
}

class Cannibal extends Piece{
  pieces;

  constructor(x, y, pieces, color) {
    super(x, y, color)
    this.pieces = Cannibal.extractPieces(pieces)
    for (const p of this.pieces){
      p.x = x;
      p.y = y;
    }
    this.label = this.initLabel()
    this.hasMoved = true;
  } 

  static extractPieces(pieces){
    const p = []
    for (const ps of pieces){
      if (ps instanceof Cannibal){
        for (const pcs of Cannibal.extractPieces(ps.pieces)){
          p.push(pcs)
        }      
      } else {
        const newP = ps.copy();
        newP.hasMoved = true;
        p.push(newP)
      }
    }
    return p;
  }

  copy(x, y){
    const ps = []
    for (const p of this.pieces){
      ps.push(p.copy(x, y))
    }
    return new Cannibal(x, y, ps, this.getColor())
  }

  move(to){
    this.x = to.x;
    this.y = to.y;
    for (const p of this.pieces){
      p.move({x: this.x, y: this.y})
    }
    game.board[this.y][this.x] = this;
  }

  initLabel(){
    let chars = []
    for (const p of this.pieces){
      if (chars.includes(p.getLabel()))continue;
      chars.push(p.getLabel())
    }
    chars.sort()
    return chars.join('')
  }  

  getPieces(){
    return this.pieces;
  }

  sees(board, square){
    for (const p of this.pieces){
      if (p.sees(board, square)){
        return true;
      }
    }
    return false;
  }

  //make a copy of the board, replacing the cannibal with each of its
  //constituent piecesS. If the move is legal for any piece, it is legal
  //for the cannibal
  isMoveLegal(theBoard, to){
    const hypothetical = Game.copyBoard(theBoard)
    for (const p of this.pieces){
      hypothetical[this.y][this.x] = p;
      if (p.isMoveLegal(hypothetical, to))return true;
    }
    return false;
  }
}

class Game {
  constructor(){
    this.boardOrientation = 1,
    //this.currentPlayer = "white",
    this.selected = null,
    this.hovered = null,
    this.validMoves = [],
    this.whiteTime = 5 * 60,
    this.blackTime = 5 * 60,
    this.lastTick = performance.now(),
    this.waitingForPromotionSelection = false,
    this.whiteVision = [],                    
    this.blackVision = [],
    this.boardIndex = 0,
    this.history = [];
    this.board = [];
  }

  initBoard(){
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString); //
    const boardExists = urlParams.get('board');

    if (!boardExists){
      for (let y = 0; y < SIZE; y++) {
        this.board[y] = []
        for (let x = 0; x < SIZE; x++) {
          this.board[y][x] = this.createPieceByStartSquare(x, y);
        }
      }
      this.updateURL();
    }
    
    else {
      const b = JSON.parse(boardExists);
      for (let y = 0; y < SIZE; y++) {
        this.board[y] = []
        for (let x = 0; x < SIZE; x++) {
          if (!b[y][x]) continue;
          this.board[y][x] = this.createPieceFromObj(b[y][x])
        }
      }
    }
  }

  createPieceFromObj(obj){
    if (obj.label.length > 1){
      const pieces = []
      for (const p of obj.pieces){
        pieces.push(this.createPieceFromObj(p))
      }
      return new Cannibal(obj.x, obj.y, pieces, obj.color)
    } else {
      switch(obj.label.toLowerCase()){
        case 'p' : return new Pawn(obj.x, obj.y, obj.color, obj.hasMoved, obj.isPassing)
        case 'n' : return new Knight(obj.x, obj.y, obj.color)
        case 'b' : return new Bishop(obj.x, obj.y, obj.color)
        case 'r' : return new Rook(obj.x, obj.y, obj.color, obj.hasMoved)
        case 'q' : return new Queen(obj.x, obj.y, obj.color)
        case 'k' : return new King(obj.x, obj.y, obj.color, obj.hasMoved)
      }
    }
  }

  createPieceByStartSquare(x, y){
    const color = y < 4 ? "black" : "white"
    if (y > 1 && y < 6) return null;
    if (y === 1 || y === 6) return new Pawn(x, y, color, false, false)
    if (x === 0 || x === 7) return new Rook(x, y, color, false)
    if (x === 1 || x === 6) return new Knight(x, y, color)
    if (x === 2 || x === 5) return new Bishop(x, y, color)
    if (x === 3)            return new Queen(x, y, color)
    if (x === 4)            return new King(x, y, color, false)
  }

  //checks for any pieces between from and to, inclusive
  //for bishop, rook, queen, (and pawn on first move)
  clearPath(board, from, to) {
    if (from.x === to.x && from.y === to.y) return false;
    const dx = Math.sign(to.x - from.x);
    const dy = Math.sign(to.y - from.y);
    let x = from.x + dx;
    let y = from.y + dy;
    while (x !== to.x || y !== to.y) {
      if (board[y][x]) return false;
      x += dx;
      y += dy;
    }
    return true;
  }

  executeMove(piece, to){
    const fromPos = {x: piece.x, y: piece.y}
    const toPiece = this.board[to.y][to.x];

    //add new cannibal
    if (toPiece && Piece.isFriendly(piece, toPiece)){
      const pieces = []
      pieces.push(piece);
      pieces.push(toPiece);
      this.board[fromPos.y][fromPos.x] = null;
      const newPiece = new Cannibal(to.x, to.y, pieces, piece.getColor());
      this.board[to.y][to.x] = newPiece;
    }   

    //normal move
    else { piece.move(to) }

    this.checkSpecialMoves(piece, fromPos)
    this.dependencyUpdates(piece, fromPos);
    this.tickState(); 
    this.checkForMate();
  }

  checkSpecialMoves(piece, fromPos){
    if (this.isEnPassant(piece, fromPos)){
      this.board[fromPos.y][piece.x] = null;
    }
    if (this.isCastles(piece, fromPos)){
      const rPos = piece.x - fromPos.x > 0 ? {x: 7, y: piece.y} : {x: 0, y: piece.y}
      const r = this.board[rPos.y][rPos.x]
      const newRPos = rPos.x === 7 ? {x: 5, y: piece.y} : {x: 3, y: piece.y}
      r.move(newRPos)
    }
  }

  isEnPassant(piece, fromPos){
    if (!(piece instanceof Pawn)) return false;
    const potentialPasser = this.board[fromPos.y][piece.x];
    if (!potentialPasser)return false;
    if (!(potentialPasser instanceof Pawn))return false;
    return potentialPasser.isPassing;
  }

  isCastles(piece, fromPos){
    if (!(piece instanceof King)) return false;
    return Math.abs(piece.x - fromPos.x) === 2
  }

  dependencyUpdates(piece, fromPos){
    piece.hasMoved = true;

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const thePiece = this.board[y][x]
        if (thePiece instanceof Pawn && thePiece.isPassing === true)thePiece.isPassing = false;
      }
    }

    //en passant stuff
    if (piece instanceof Pawn){
      if (Math.abs(piece.y-fromPos.y) === 2){
        const leftNeighbor = game.board[piece.y][piece.x-1]
        const rightNeighbor = game.board[piece.y][piece.x+1]
        if (leftNeighbor instanceof Pawn && !Piece.isFriendly(piece, leftNeighbor)){
          piece.isPassing = true;
        }
        if (rightNeighbor instanceof Pawn && !Piece.isFriendly(piece, rightNeighbor)){
          piece.isPassing = true;
        }
      }  
    }
  }

  tickState(){
    //this.currentPlayer = this.currentPlayer === "white" ? "black" : "white";
    this.selected = null;
    this.validMoves = [];
  }

  storeNewPosition(){
    const stored = []
    for (let y = 0; y < SIZE; y++) {
      stored[y] = []
      for (let x = 0; x < SIZE; x++) {
        const thePiece = this.board[y][x];

        if (thePiece){
          stored[y][x] = thePiece.copy(x, y);
        } else {
          stored[y][x] = null;
        }
      }
    }
    this.history.push(stored)
  }

  checkForMate(){
    // let legalMoves = 0;
    // for (let y = 0; y < SIZE; y++) {
    //   for (let x = 0; x < SIZE; x++) {
    //     const thePiece = this.board[y][x]
    //     if (!thePiece) continue;
    //     if (thePiece.getColor() != this.currentPlayer) continue;
    //     const moves = thePiece.getValidMoves(game.board);
    //     legalMoves += moves.length;
    //   }
    // }
    // if (legalMoves === 0){
    //   const otherColor = this.currentPlayer === "white" ? "black" : "white"
    //   const king = this.getKing(this.currentPlayer)
    //   if (this.playerSees(otherColor, this.board, {x: king.x, y: king.y})){
    //     console.log("checkmate")
    //   } else {
    //     console.log("stalemate")
    //   }
    // }
  }

  getKing(color){
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const thePiece = this.board[y][x]
        if (!thePiece) continue;
        if (thePiece.getColor() === color && thePiece instanceof King)return thePiece
      }
    }
  }

  //new array object that uses the same pieces
  static copyBoard(whichBoard){
    const copy = []
    for (let y = 0; y < SIZE; y++) {
      copy[y] = []
      for (let x = 0; x < SIZE; x++) {
        copy[y][x] = whichBoard[y][x]
      }
    }
    return copy;
  }

  playerSees(color, theBoard, square){
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const thePiece = theBoard[y][x]
        if (!thePiece) continue;
        if (thePiece.getColor() !== color) continue;
        if (thePiece.sees(theBoard, square))return true;
      }
    }
    return false;
  }

  resultsInEnemyCheck(theBoard, piece, to){
    const hypothetical = Game.copyBoard(theBoard);
    hypothetical[piece.y][piece.x] = null;
    hypothetical[to.y][to.x] = piece; 
    const enemyColor = piece.getColor() === "white" ? "black" : "white";

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const thePiece = hypothetical[y][x];
        if (!(thePiece instanceof King && thePiece.getColor() === piece.getColor())) continue;
      
        if (this.playerSees(enemyColor, hypothetical, {x: x, y: y})){
          return true;
        }
      }
    }
    return false;
  }

  drawBoard() {
    ctx.fillStyle = "rgba(20, 20, 20, 255)";
    ctx.fillRect(boardOffset.x -6, boardOffset.y-6, 268, 268);
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? "rgba(110, 110, 110, 255)" : "rgba(40, 35, 30, 255)";
        ctx.fillRect(boardOffset.x + x * TILE,boardOffset.y + y * TILE, TILE, TILE);
      }
    }

    this.renderPieces();
  }

  renderPieces(){
    for (const row of this.board){
      for (const obj of row){
        if (obj instanceof Piece){
          obj.render();
        } 
      }
    }
  }

  drawMoveDots() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";

    for (const m of this.validMoves) {
      const { sx, sy } = this.boardToScreen(m.x, m.y)
      ctx.beginPath();
      ctx.fillRect(
        sx+12,
        sy+12,
        8,
        8
      );
      ctx.fill();
    }
  }

  screenToBoard(pos) {
    const sx = Math.floor((pos.x-boardOffset.x) / TILE);  
    const sy = Math.floor((pos.y-boardOffset.y) / TILE);  
    const x = this.boardOrientation === 1 ? sx : 7-sx
    const y = this.boardOrientation === 1 ? sy : 7-sy
    return {x: x, y: y}
  }

  boardToScreen(x, y){
    const boardOr = this.boardOrientation === 1 ? {x: x, y: y} : {x: 7-x, y: 7-y}
    return {sx: TILE*boardOr.x+boardOffset.x, sy: TILE*boardOr.y + boardOffset.y}
  }

  //coordinates of the square that was pressed
  onMouseDown(x, y){
    if (this.selected){

      //deselect
      if (this.selected.x === x && this.selected.y === y){
        this.selected = null;
        this.validMoves = [];
        return;
      }

      //execute a move
      if(this.board[this.selected.y][this.selected.x].isMoveLegal(this.board, { x, y }, true)) {
        if (!this.board[y][x]){
          moveSound.play();
        }
        else if (this.board[y][x].getColor() === this.board[this.selected.y][this.selected.x].getColor()){
          cannibalSound.play();
        }
        else if (this.board[y][x].getColor() !== this.board[this.selected.y][this.selected.x].getColor()){
          captureSound.play();
        }
        this.executeMove(this.board[this.selected.y][this.selected.x], { x, y})
        this.updateURL();
        this.storeNewPosition();
        return;
      }
    }

    if (this.board[y][x]){
      this.select(x, y);
    }

  }

  updateURL(){
    const url = new URL(window.location.href);
    url.searchParams.set('board', JSON.stringify(this.board));
    const updatedURL = url.toString(); 
    window.history.replaceState(null, null, updatedURL);
  }

  onMouseMove(x, y){
    if (!this.board[y][x]) {
      this.hovered = null;
      return;
    }
    if(this.board[y][x]){
      this.hovered = {x: x, y: y}
    }
  }

  onKeyDown(event){
    if (event.key.startsWith("Arrow")) event.preventDefault();
    switch(event.key){
      case "f" : this.boardOrientation *= -1; return;
      case "ArrowLeft" : this.tryRetreat(); return;
      case "ArrowRight" : this.tryAdvance(); return;
    }
  }

  tryAdvance(){
    if (this.boardIndex > 0){
      this.boardIndex--;
      this.board = this.history[this.history.length-(1+this.boardIndex)]
    }
  }

  tryRetreat(){
    if (this.boardIndex < this.history.length-1){
      this.boardIndex++;
      this.board = this.history[this.history.length-(1+this.boardIndex)]
    }
  }

  select(x, y){
    this.selected = {x: x, y: y}
    this.validMoves = this.board[y][x].getValidMoves(this.board);
  }

  updateClocks() {
    const now = performance.now();
    const dt = (now - lastTick) / 1000;
    lastTick = now;

    // if (currentPlayer === "white") {
    //   whiteTime = Math.max(0, whiteTime - dt);
    // } else {
    //   blackTime = Math.max(0, blackTime - dt);
    // }
  }
}

/* ---------- Init ---------- */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const UI_WIDTH  = 512;
const UI_HEIGHT = 396; 
const SIZE = 8;
const TILE = 32;
const boardOffset = {x: 6, y: 64}
const pieceOrder = ['b', 'n', 'p', 'q', 'r']
const pieceBuffers = new Map()
const imgBuffers = new Map()
const flagImages = []
let flagSpeed = 0;
let flagSample = 1;
const game = new Game();
game.initBoard();
//game.storeNewPosition();
let moveSound = new Audio("assets/sound/plastic1.wav");
let captureSound = new Audio("assets/sound/plastic2.wav");
let cannibalSound = new Audio("assets/sound/metal2.wav");
initBuffers();
loadFlag();
loop();

function initBuffers(){
  for (const i of generateCombinations(5)){
    let pieceComb = "";
    for (const j of i){
      pieceComb += pieceOrder[j];
    }

    const whiteLabel = "white-"+pieceComb
    const blackLabel = "black-"+pieceComb
    getBuffer(whiteLabel, imgLoadCallback);
    getBuffer(blackLabel, imgLoadCallback);
  }
  getBuffer("white-k", imgLoadCallback);
  getBuffer("black-k", imgLoadCallback);
}

function getBuffer(name, callback){
  const img = new Image();
  img.src = `assets/pieces/${name}.png`;
  img.onload = function() {
    callback(name, img);
    imgBuffers.set(name, img)
  };
}

function imgLoadCallback(name, img){
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = img.width;
  tempCanvas.height = img.height;
  const tempCtx = tempCanvas.getContext("2d");
  tempCtx.drawImage(img, 0, 0);
  const imageData = tempCtx.getImageData(0, 0, img.width, img.height);
  const pixels = imageData.data;
  const buffer = []
  for (let y = 0; y < img.height; y++) {
    buffer[y] = []
    for (let x = 0; x < img.width; x++) {
      const i = (y * img.width + x) * 4;
      let r = pixels[i];
      let g = pixels[i + 1];
      let b = pixels[i + 2];
      let a = pixels[i + 3] / 255; // normalize alpha 0-1
      buffer[y][x] = [r, g, b, a];
    }
  }
  pieceBuffers.set(String(name), buffer)
}

function loadFlag(){
  for (let i = 1; i < 1000; i++){
    const img = new Image();
    const name = "flag"+String(i);
    img.src = `assets/flag/${name}.png`;
    img.onload = function() {
      flagImages[i] = img;
    }
  }
}

function generateCombinations(n) {
  const result = [];
  function backtrack(start, combo) {
    if (combo.length > 0) {
      result.push([...combo]);
    }
    for (let i = start; i < n; i++) {
      combo.push(i);
      backtrack(i + 1, combo);
      combo.pop();
    }
  }
  backtrack(0, []);
  return result;
}

function inBounds(x, y) {
  return x >= 0 && x < SIZE && y >= 0 && y < SIZE;
}

/* ---------- Input ---------- */
canvas.addEventListener("mousemove", e =>{
  const coords = game.screenToBoard(getCursorPosition(canvas, e));
  if (!inBounds(coords.x, coords.y)) return;
  game.onMouseMove(coords.x, coords.y)
})

canvas.addEventListener("mousedown", e => {
  const coords = game.screenToBoard(getCursorPosition(canvas, e));
  if (!inBounds(coords.x, coords.y)) return;
  game.onMouseDown(coords.x, coords.y);
});

window.addEventListener("keydown", e => {
  game.onKeyDown(e)
});

function getCursorPosition(canvas, event) {
  const rect = canvas.getBoundingClientRect()
  const x = event.clientX - rect.left
  const y = event.clientY - rect.top
  return {x: x-12, y: y}
}

/* ---------- Loop ---------- */
function loop() {
  drawBackground();
  game.drawBoard();
  game.drawMoveDots();
  //game.updateClocks();
  //game.drawClocks();
  requestAnimationFrame(loop);
}

function drawBackground(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  flagSpeed++;
  if (flagSpeed%5 === 0){
    flagSample++;
    flagSample = flagSample%1000 +1
  }

  if (flagImages[flagSample]){
    ctx.drawImage(
      flagImages[flagSample],
      0, 
      0,
      canvas.width,
      canvas.height+90
    ); 
  };
}
