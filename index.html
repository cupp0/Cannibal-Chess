<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }

    canvas {
      border: 10px solid #555;
      background: #111;
      cursor: pointer;
    }
  </style>
</head>
<body>

<canvas id="board" width="480" height="480"></canvas>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const SIZE = 8;
const TILE = canvas.width / SIZE;
const sprites = {};
const pieceMap = {
  P: "white-pawn",
  R: "white-rook",
  N: "white-knight",
  B: "white-bishop",
  Q: "white-queen",
  K: "white-king",
  p: "black-pawn",
  r: "black-rook",
  n: "black-knight",
  b: "black-bishop",
  q: "black-queen",
  k: "black-king"
};

//state
let boardOrientation = 1;
let currentPlayer = "white";
let selected = null;
let validMoves = [];
let whiteTime = 5 * 60; // seconds
let blackTime = 5 * 60;
let activeClock = "white";
let lastTick = performance.now();
let whiteCastled = false;
let blackCastled = false;
let whiteKingMoved = false;
let blackKingMoved = false;
let whiteARookMoved = false;
let blackARookMoved = false;
let whiteHRookMoved = false;
let blackHRookMoved = false;
let waitingForPromotionSelection = false;
let promotionSquare = [0,0]
let enPassantTarget = [-1, 0]
const whiteSeenSquares = []
const blackSeenSquares = []

/* ---------- Init ---------- */

const board = [
  ["r","n","b","q","k","b","n","r"],
  ["p","p","p","p","p","p","p","p"],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["","","","","","","",""],
  ["P","P","P","P","P","P","P","P"],
  ["R","N","B","Q","K","B","N","R"]
];

for (const [key, name] of Object.entries(pieceMap)) {
  const img = new Image();
  img.src = `assets/pieces/${name}.png`;
  img.onload = () => {
       
  }
  sprites[key] = img; 
}

loop();

/* ---------- Helpers ---------- */

function isWhite(p) { return p === p.toUpperCase(); }

function isBlack(p) { return p === p.toLowerCase(); }

function hasPiece(x, y){
  return board[y][x] !== "";
}

function isPrimitive(p){
  if (p.length <= 1) return true;
  return false;
}

function isFriendly(p) {
  if (!p) return false;
  return currentPlayer === "white" ? isWhite(p) : isBlack(p);
}

/* ---------- Drawing ---------- */

function boardToScreen(x, y) {
  if (boardOrientation === 1) {
    return { sx: x, sy: y };
  }
  return {
    sx: 7 - x,
    sy: 7 - y
  };
}

function drawBoard() {
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const { sx, sy } = boardToScreen(x, y);
      ctx.fillStyle = (x + y) % 2 === 0 ? "#f0d9b5" : "#b58863";
      ctx.fillRect(sx * TILE, sy * TILE, TILE, TILE);

      if (selected && selected.x === x && selected.y === y) {
        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 4;
        ctx.strokeRect(sx * TILE + 2, sy * TILE + 2, TILE - 4, TILE - 4);
      }
      
      drawPiece(x, y, board[y][x]);
    }
  }
}

function drawPiece(x, y, p) {
  if (!p) return;

  const { sx, sy } = boardToScreen(x, y);

  const imgs = [];
  for (const char of p){
    imgs.push(sprites[char])
  }
  
  const pad = TILE * 0.1;
  for (const image of imgs){
    ctx.drawImage(
      image,
      sx * TILE + pad,
      sy * TILE + pad,
      TILE - pad * 2,
      TILE - pad * 2
    );  
  }
}

function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

function drawClocks() {
  ctx.fillStyle = "white";
  ctx.font = "20px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`White ${formatTime(whiteTime)}`, 10, 16);
  ctx.textAlign = "right";
  ctx.fillText(`Black ${formatTime(blackTime)}`, canvas.width -10, 16);
}

function drawMoveDots() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.4)";

  for (const m of validMoves) {
    const { sx, sy } = boardToScreen(m.x, m.y)
    ctx.beginPath();
    ctx.arc(
      sx * TILE + TILE / 2,
      sy * TILE + TILE / 2,
      TILE * 0.12,
      0,
      Math.PI * 2
    );
    ctx.fill();
  }
}

/* ---------- Movement Logic ---------- */

function executeMove(from, to){
  if (isLegalMove(from, to)) {
    if (waitingForPromotionSelection === true)return;
    //castles
    if (isCastling(from, to) === true){
      castles(from, to);
    }    
    //consumes
    else if (isFriendly(board[to.y][to.x])){
      board[to.y][to.x] += board[from.y][from.x];
    }  
    //promotes
    else if (isPawnPromoting(from, to)){
      beginPromotion(from, to); 
      return;
    }
    //en passant
    else if (isEnPassant(from, to)){
      executeEnPassant(from, to)
    }
    //normal move
    else { board[to.y][to.x] = board[from.y][from.x] } 
    //empty the 'from' square
    board[from.y][from.x] = "";

    //post move state chores
    updateCastlingDependencies(from, to)
    updateEnPassantTarget(from, to)
    updateSeenSquares();
    currentPlayer = currentPlayer === "white" ? "black" : "white";
  } 
  selected = null;
  validMoves = [];
}

function inBounds(x, y) {
  return x >= 0 && x < 8 && y >= 0 && y < 8;
}

function getValidMoves(from) {
  const moves = [];

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (isLegalMove(from, { x, y })) {
        moves.push({ x, y });
      }
    }
  }
  return moves;
}

function isLegalMove(from, to) {
  const p = board[from.y][from.x];
  const target = board[to.y][to.x];
  const pieceColor = isWhite(p) ? "white" : "black"

  if (from.x === to.x && from.y === to.y) return false;

  //don't allow combining with king
  if (combinesWithKing(from, to)) return false;

  const dx = to.x - from.x;
  const dy = to.y - from.y;

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  const dir = isWhite(p) ? -1 : 1;

  for (let i = 0; i < p.length; i++){
    switch (p.charAt(i).toLowerCase()) {
      case "p":
        if (!target && dx === 0 && dy === dir) return true;
        if (!target && dx === 0 && dy === dir * 2 &&
            ((pieceColor == "white" && from.y === 6) || (pieceColor == "black" && from.y === 1)))
          return true;
        if (absX === 1 && dy === dir){ 
          if (target) return true;
          if (enPassantTarget[0] === to.x && enPassantTarget[1] === to.y) return true;
        }
        break;

      case "r":
        if (dx !== 0 && dy !== 0) break;
        if (clearPath(from, to, p)) return true;
        break;

      case "b":
        if (absX !== absY) break;
        if (clearPath(from, to, p)) return true;
        break;


      case "q":
        if (!(dx === 0 || dy === 0 || absX === absY)) break;
        if (clearPath(from, to, p)) return true;
        break;

      case "n":
        if ((absX === 1 && absY === 2) || (absX === 2 && absY === 1)) return true;
        break;

      case "k":
        if (pieceColor === "white" && blackSeenSquares[to.y][to.x] == true)return false;
        if (pieceColor === "black" && whiteSeenSquares[to.y][to.x] == true)return false;
        if (absX <= 1 && absY <= 1 && clearPath(from, to, p)) return true;
        if (isCastlingLegal(from, to)) return true;
        break;
    }
  }


  return false;
}

function clearPath(from, to, p) {
  const dx = Math.sign(to.x - from.x);
  const dy = Math.sign(to.y - from.y);

  let x = from.x + dx;
  let y = from.y + dy;

  while (x !== to.x || y !== to.y) {
    if (board[y][x]) return false;
    x += dx;
    y += dy;
  }
  return true;
}

//return true iff both arg squares contain pieces of the same color and one of the squares has a king
function combinesWithKing(from, to){
  if (!hasPiece(from.x, from.y) || !hasPiece(to.x, to.y)) return false;
  if (isWhite(board[from.y][from.x]) !== isWhite(board[to.y][to.x])) return false;
  if (board[from.y][from.x].toUpperCase() === "K" || board[to.y][to.x].toUpperCase() === "K") return true;
  return false;
}

//from will always be a king. nothing else is guaranteed
function isCastlingLegal(from, to){

  //ensure king hasn't moved
  const kingColor = isWhite(board[from.y][from.x]) === true ? "white" : "black"
  if (kingColor === "white" && whiteKingMoved === true) return false;
  if (kingColor === "black" && blackKingMoved === true) return false;

  //ensure the 'to' location is valid for castling
  if (Math.abs(from.x-to.x) !== 2)return false;
  if (from.y-to.y !== 0)return false;

  //ensure rook hasn't moved
  const dir = from.x > to.x ? "left" : "right" 
  if (kingColor === "white"){
    if (dir === "left" && whiteARookMoved === true) return false;
    if (dir === "right" && whiteHRookMoved === true) return false;
  }
  if (kingColor === "black"){
    if (dir === "left" && blackARookMoved === true) return false;
    if (dir === "right" && blackHRookMoved === true) return false;
  }

  //ensure path is clear
  if (kingColor === "white"){
    if (dir === "left"){
      if (blackSeenSquares[7][3] === true || blackSeenSquares[7][2] === true) return false;
    }
    if (dir === "right"){
      if (blackSeenSquares[7][5] === true || blackSeenSquares[7][6] === true) return false;
    }
  }
  if (kingColor === "black"){
    if (dir === "left"){
      if (whiteSeenSquares[0][3] === true || whiteSeenSquares[0][2] === true) return false;
    }
    if (dir === "right"){
      if (whiteSeenSquares[0][5] === true || whiteSeenSquares[0][6] === true) return false;
    }
  }

  return true;
}

//this method only called once the move is confirmed legal
//confirm the moving piece is a king and that it is moving more than 1 square
function isCastling(from, to){
  let piece = board[from.y][from.x];
  if (piece.toUpperCase() !== "K")return false;
  if (Math.abs(from.x-to.x) > 1)return true;
  return false;
}

function castles(from, to){
  const king = board[from.y][from.x];
  const kingColor = king === "K" ? "white" : "black";
  const dir = (from.x > to.x) ? -1 : 1;

  board[from.y][from.x+(2*dir)] = king;
  board[from.y][from.x+dir] = kingColor === "white" ? "R" : "r"
  board[from.y][from.x] = "";

  if (dir === 1)  board[from.y][7] = ""
  if (dir === -1) board[from.y][0] = ""
  board[from.y][from.x] = ""

  if (kingColor === "white") whiteCastled = true;
  if (kingColor === "black") blackCastled = true;
}

//move is known to be legal
function isEnPassant(from, to){
  if (enPassantTarget[0] === -1)return false;
  if (to.x !== enPassantTarget[0] || to.y !== enPassantTarget[1])return false;
  if (board[from.y][from.x].toUpperCase() !== "P")return false;
  return true;
}

//move is known to be a legal en passant
function executeEnPassant(from, to){
  board[to.y][to.x] = board[selected.y][selected.x]
  board[from.y][to.x] = ""
}

function isPawnPromoting(from, to){
  let piece = board[from.y][from.x];
  if (piece.toUpperCase() !== "P") return false;
  const pawnColor = piece === "P" ? "white" : "black"
  
  if (pawnColor === "white" && to.y === 0)return true;
  if (pawnColor === "black" && to.y === 7)return true;
}

function beginPromotion(from, to){
  promotionSquare[0] = to.x;
  promotionSquare[1] = to.y;
  waitingForPromotionSelection = true;
}

function completePromotion(p){
  if (currentPlayer === "white"){
    board[promotionSquare[1]][promotionSquare[0]] = p.toUpperCase();
  } else {
    if (currentPlayer === "white")board[promotionSquare[1]][promotionSquare[0]] = p;
  }
  waitingForPromotionSelection = false;

  board[selected.y][selected.x] = ""
  updateCastlingDependencies(selected, promotionSquare)
  updateSeenSquares();
  currentPlayer = currentPlayer === "white" ? "black" : "white";
  selected = null;
  validMoves = [];
}

/* ---------- Post Move Updates ---------- */

function updateSeenSquares(){

  //reset both lists
  for (let y = 0; y < SIZE; y++) {
    whiteSeenSquares[y] = []
    blackSeenSquares[y] = []

    for (let x = 0; x < SIZE; x++) {
      whiteSeenSquares[y][x] = false;
      blackSeenSquares[y][x] = false;
    }
  }

  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      if (hasPiece(x, y)){
        const localMoves = getValidMoves({x, y});      
        for (const m of localMoves){
          if (isWhite(board[y][x])){
            whiteSeenSquares[m.y][m.x] = true;
          } else {
            blackSeenSquares[m.y][m.x] = true;
          }
        }
      }
    }
  }
}

function updateCastlingDependencies(from, to){
  if ((from.x === 0 && from.y === 0) || (to.x === 0 && to.y === 0)) blackARookMoved = true;
  if ((from.x === 7 && from.y === 0) || (to.x === 7 && to.y === 0)) blackHRookMoved = true;
  if ((from.x === 0 && from.y === 7) || (to.x === 0 && to.y === 7)) whiteARookMoved = true;
  if ((from.x === 7 && from.y === 7) || (to.x === 7 && to.y === 7)) whiteHRookMoved = true;
  if ((from.x === 4 && from.y === 0) || (to.x === 4 && to.y === 0)) blackKingMoved = true;
  if ((from.x === 4 && from.y === 7) || (to.x === 4 && to.y === 7)) whiteKingMoved = true;
}

function updateEnPassantTarget(from, to){
  let piece = board[to.y][to.x];

  if (piece.toUpperCase() !== "P"){
    enPassantTarget[0] = -1;
    return;
  }
  const pawnColor = piece === "P" ? "white" : "black"

  let leftNeighbor = "z"
  let rightNeighbor = "z"
  const leftNeighborValid = to.x > 0
  const rightNeighborValid = to.x < 7
  
  if (leftNeighborValid === true) leftNeighbor = board[to.y][to.x-1];
  if (rightNeighborValid === true) rightNeighbor = board[to.y][to.x+1];

  if (pawnColor === "white"){
    //confirm pawn moving from starting square to two forward
    if (from.y !== 6 || to.y !== 4){
      enPassantTarget[0] = -1;
      return;
    }

    //confirm neighbors at destination are enemy pawns
    if (leftNeighbor === "p" || rightNeighbor === "p"){
      enPassantTarget[0] = from.x;
      enPassantTarget[1] = (from.y+to.y)/2;
      return;
    }
  }

  if (pawnColor === "black"){
    if (from.y !== 1 || to.y !== 3){
      enPassantTarget[0] = -1;
      return;
    }

    if (leftNeighbor === "P" || rightNeighbor === "P"){
      enPassantTarget[0] = from.x;
      enPassantTarget[1] = (from.y+to.y)/2;
      return;
    }
  }

}

/* ---------- Input ---------- */

canvas.addEventListener("click", e => {
  const rect = canvas.getBoundingClientRect();
  const { sx, sy } = boardToScreen(Math.floor((e.clientX - rect.left) / TILE), Math.floor((e.clientY - rect.top) / TILE));
  const x = sx
  const y = sy  
  if (!inBounds(x, y)) return;
  
  if (selected && isLegalMove(selected, ( { x, y }))) {
    executeMove(selected, { x, y})
  } else if (isFriendly(board[y][x])) {
    selected = { x, y };
    validMoves = getValidMoves(selected);
  }

});

window.addEventListener("keydown", e => {
  if (e.key === "f"){
    boardOrientation *= -1
  }
  if (waitingForPromotionSelection === true){
    if(e.key === "q" || e.key === "r" || e.key === "n" || e.key === "b"){
      completePromotion(e.key)
    }
  }
});

/* ---------- Loop ---------- */

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBoard();
  if (selected) drawMoveDots();
  drawClocks();
  updateClocks();
  requestAnimationFrame(loop);
}

function updateClocks() {
  const now = performance.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  if (currentPlayer === "white") {
    whiteTime = Math.max(0, whiteTime - dt);
  } else {
    blackTime = Math.max(0, blackTime - dt);
  }
}

</script>
</body>
</html>
